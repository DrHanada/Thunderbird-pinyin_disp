name: Build Thunderbird XPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: Upload XPI and lockfile
        uses: actions/upload-artifact@v5
        with:
          name: thunderbird-pinyin-display-0.1.1-submission
          path: |
            dist/*.xpi
            package-lock.json
